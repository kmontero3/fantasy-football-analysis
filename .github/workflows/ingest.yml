name: Data Ingestion

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        env:
          PHINASTY_LEAGUE_2023: ${{ secrets.PHINASTY_LEAGUE_2023 }}
          PHINASTY_LEAGUE_2024: ${{ secrets.PHINASTY_LEAGUE_2024 }}
          PHINASTY_LEAGUE_2025: ${{ secrets.PHINASTY_LEAGUE_2025 }}
          PHINASTY_LEAGUE_2026: ${{ secrets.PHINASTY_LEAGUE_2026 }}
        run: python -m data_layer.ingestion.run_ingestion

      - name: Verify database integrity
        run: python -m scripts.check_db

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fantasy.db
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update fantasy.db via scheduled ingestion"
            git push
          fi
